name: Build APK

# این فایل باعث می‌شه هر بار که پروژه رو روی GitHub پوش/آپلود می‌کنید،
# یک سرور گیت‌هاب (با اینترنت کامل و بدون فیلترینگ) خودش SDK اندروید
# لازم رو دانلود کنه و اپ رو بسازه. لازم نیست چیزی روی سیستم خودتون
# نصب باشه.

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PriceSync-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
